name: Build

# Every push to main is linted, tested and built.
# When the plugin version in src/plg_system_ytrutube/ytrutube.xml has no release yet,
# the tag vX.Y.Z and a GitHub release with the installable package are created automatically.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' src/plg_system_ytrutube/ytrutube.xml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v${{ steps.version.outputs.version }}" = "${GITHUB_REF_NAME}"

      - name: Lint, test and build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plg_system_ytrutube_${{ steps.version.outputs.version }}
          path: dist/*.zip

      - name: Publish release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/main' && steps.version.outputs.released == 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: YT RuTube ${{ steps.version.outputs.version }}
          files: dist/*.zip
          body: |
            **YT RuTube ${{ steps.version.outputs.version }}** — lazy RuTube video element for YOOtheme Pro on Joomla 5/6.

            Download **plg_system_ytrutube_${{ steps.version.outputs.version }}.zip** below and install it in Joomla: *System → Install → Extensions*. Changes: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            ---

            **YT RuTube ${{ steps.version.outputs.version }}** — элемент видео RuTube для YOOtheme Pro на Joomla 5/6. Скачайте **plg_system_ytrutube_${{ steps.version.outputs.version }}.zip** и установите через «Система → Установка → Расширения». Подробности: [README.ru.md](https://github.com/${{ github.repository }}/blob/main/README.ru.md).
          generate_release_notes: false
